name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and offline tests
        run: node --test tests/core.test.cjs tests/offline.test.cjs tests/custom-books.test.cjs tests/rewards.test.cjs tests/covers.test.cjs tests/modules.test.cjs tests/school-email.test.cjs tests/school-script.test.cjs tests/library.test.cjs tests/sync.test.cjs
      - name: Every name in docs/app is defined or imported
        run: npx --yes eslint@10.1.0 docs/app
      - name: Generated files are up to date
        run: python3 scripts/build.py --check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One family can never see or change another's (the database rules, on a scratch Postgres)
        run: node --test tests/db.test.cjs
        env:
          BOOKDUDE_TEST_DB: postgres://postgres:postgres@localhost:5432/postgres

  browser:
    # Playwright 1.56.1 has no Chromium for Ubuntu 26.04, which ubuntu-latest moved to in November 2026.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Click through every feature and compare with the saved run
        run: node tests/browser/clickthrough.cjs
      - name: Her reading history lands once and works offline
        run: node tests/browser/history.cjs
      - name: School quiz emails land once and add books not in the app
        run: node tests/browser/school-email.cjs
      - name: The app version shows, and updates switch over
        run: node tests/browser/update.cjs
      - name: The talking Dude, with the Google script played by the test
        run: node tests/browser/dude-ai.cjs
      - name: AR points by quarter, apart from other points
        run: node tests/browser/ar-points.cjs
      - name: Fig's Litter-Robot, the parties, and piano practice
        run: node tests/browser/pet-party.cjs
      - name: The Millcreek Trail game
        run: node tests/browser/millcreek-trail.cjs
      - name: Spelling BB
        run: node tests/browser/spelling-bee.cjs
      - name: Home points and finding a cover
        run: node tests/browser/home-points.cjs
      - name: The Games tab and Maple's Big Day
        run: node tests/browser/games.cjs
      - name: The family account on two devices, with Supabase's API played over the real database script
        run: node tests/browser/account.cjs
        env:
          BOOKDUDE_TEST_DB: postgres://postgres:postgres@localhost:5432/postgres
